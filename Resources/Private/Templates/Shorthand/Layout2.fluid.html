<html
    xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
    xmlns:cozybackend="http://typo3.org/ns/Cozy/Backend/Components/ComponentCollection"
    data-namespace-typo3-fluid="true"
>
<f:layout name="Default"/>

<f:section name="Main">
    <section class="text-media-custom tm-no-bg py-5">
        <div class="container ">
            <div class="row g-4 align-items-center">

                <div class="col-lg-6">
                    <f:for as="image" each="{files}">
                        <img alt="{image.title}" class="tm-img rounded shadow" src="{f:uri.image(image:image, width: '925c', height: '634c')}">
                    </f:for>
                </div>

                <div class="col-lg-6">
                    <h2 class="fw-bold mb-3">{data.header}</h2>

                    <f:format.html>{data.bodytext}</f:format.html>

                    <f:if condition="{data.header_link}">
                        <div class="mt-3">
                            <f:link.typolink parameter="{data.header_link}">
                                <cozybackend:atoms.button
                                    variant="primary"
                                    text="{data.subheader}"
                                />
                            </f:link.typolink>
                        </div>
                    </f:if>
                </div>

            </div>
        </div>
    </section>
</f:section>
</html>
