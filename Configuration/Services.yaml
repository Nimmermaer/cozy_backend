services:
  _defaults:
    autowire: true
    autoconfigure: true
    public: false
  Mblunck\CozyBackend\:
    resource: '../Classes/*'
    exclude:
      - '../Classes/Domain/Model/*'
      # Registered conditionally in Services.php (needs hn/typo3-mcp-server)
      - '../Classes/Mcp/*'

  Mblunck\CozyBackend\EventListener\PageModulePreviewEventListener:
    tags:
      - name: event.listener
        identifier: 'page-properties-to-page-module'

  Mblunck\CozyBackend\UserFunc\ElementListUserFunc:
    public: true
